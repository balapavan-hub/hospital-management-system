{% extends "base.html" %}
{% block title %}Edit Medicine - MediConnect India{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 bg-white">
                <div class="card-header bg-white border-0 py-3 d-flex align-items-center">
                    <a href="{{ url_for('pharmacist.inventory') }}" class="btn btn-link p-0 me-3 text-decoration-none text-dark fs-4"><i class="bi bi-arrow-left"></i></a>
                    <h5 class="mb-0 fw-bold">Edit Medicine: {{ item.item_name }}</h5>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('pharmacist.edit_inventory', id=item.id) }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase text-muted">Item Name *</label>
                            <input type="text" name="item_name" class="form-control" value="{{ item.item_name }}" required>
                        </div>
                        
                        <div class="row mb-3 g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">Category *</label>
                                <select name="category" class="form-select" required>
                                    <option value="Tablet" {% if item.category == 'Tablet' %}selected{% endif %}>Tablet</option>
                                    <option value="Syrup" {% if item.category == 'Syrup' %}selected{% endif %}>Syrup</option>
                                    <option value="Capsule" {% if item.category == 'Capsule' %}selected{% endif %}>Capsule</option>
                                    <option value="Injection" {% if item.category == 'Injection' %}selected{% endif %}>Injection</option>
                                    <option value="Ointment" {% if item.category == 'Ointment' %}selected{% endif %}>Ointment</option>
                                    <option value="Suspension" {% if item.category == 'Suspension' %}selected{% endif %}>Suspension</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">Stock Level *</label>
                                <input type="number" name="quantity" class="form-control" value="{{ item.quantity }}" required>
                            </div>
                        </div>

                        <div class="row mb-3 g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">Unit Type</label>
                                <input type="text" name="unit" class="form-control" value="{{ item.unit }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">Min Threshold Level</label>
                                <input type="number" name="min_stock_level" class="form-control" value="{{ item.min_stock_level }}">
                            </div>
                        </div>

                        <div class="row mb-3 g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">Purchase Price (₹) *</label>
                                <input type="number" step="0.01" name="purchase_price" class="form-control" value="{{ item.purchase_price }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">Selling Price (₹) *</label>
                                <input type="number" step="0.01" name="selling_price" class="form-control" value="{{ item.selling_price }}" required>
                            </div>
                        </div>

                        <div class="row mb-4 g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">Expiry Date *</label>
                                <input type="date" name="expiry_date" class="form-control" value="{{ item.expiry_date.strftime('%Y-%m-%d') }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-uppercase text-muted">Supplier</label>
                                <select name="supplier_id" class="form-select">
                                    <option value="0">--- No Supplier Selected ---</option>
                                    {% for s in suppliers %}
                                        <option value="{{ s.id }}" {% if item.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold">
                            <i class="bi bi-check2-circle me-1"></i>Update Medicine Details
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
